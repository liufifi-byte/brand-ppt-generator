<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Brand PPT Generator</title>
<style>
  :root {
    --primary: #004A86; --accent: #00AAE8; --dark: #4C4948;
    --body: #1A1A1A; --bg: #F5F8FC; --card-bg: #E8F1F8; --line: #D8E2EC;
  }
  * { box-sizing: border-box; margin: 0; }
  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--body); min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
  }
  header {
    width: 100%; background: #fff; border-bottom: 1px solid var(--line);
    padding: 14px 0; position: sticky; top: 0; z-index: 10;
  }
  header .inner {
    max-width: 1080px; margin: 0 auto; padding: 0 20px;
    display: flex; align-items: center;
  }
  header h1 { font-size: 17px; color: var(--primary); font-weight: 600; }
  main {
    width: 100%; max-width: 1080px; padding: 24px 20px 60px;
    display: grid; grid-template-columns: 220px 1fr; gap: 24px;
    align-items: start;
  }
  @media (max-width: 860px) { main { grid-template-columns: 1fr; } }

  /* 左侧栏 · 历史任务 (无卡片框) */
  #sidebar { position: sticky; top: 76px; }
  #sidebar .cap {
    font-size: 11px; letter-spacing: 2px; color: var(--dark);
    text-transform: uppercase; padding: 0 4px 8px;
    border-bottom: 1px solid var(--line); margin-bottom: 4px;
  }
  ul.jobs { list-style: none; }
  ul.jobs li {
    padding: 9px 6px; font-size: 12.5px; border-radius: 6px;
    display: flex; flex-direction: column; gap: 3px; cursor: pointer;
  }
  ul.jobs li:hover { background: var(--card-bg); }
  ul.jobs li:focus-visible { outline: 2px solid var(--accent); }
  ul.jobs li .row1 { display: flex; align-items: center; gap: 6px; }
  .st {
    font-size: 10px; padding: 1px 7px; border-radius: 10px;
    background: var(--card-bg); color: var(--primary); white-space: nowrap;
  }
  .st.done { background: #e2f6ea; color: #1c7c46; }
  .st.failed { background: #fdeae6; color: #b3362a; }
  .st.running, .st.queued { background: #e3f2fd; color: #1258a8; }
  .jname {
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1;
    color: var(--body);
  }
  .jtime { color: var(--dark); font-size: 10.5px; padding-left: 2px; }
  .empty { color: var(--dark); font-size: 12px; padding: 8px 6px; }

  /* 主列 */
  #drop {
    background: #fff; border: 2px dashed var(--line); border-radius: 12px;
    padding: 44px 20px; text-align: center; cursor: pointer;
    transition: all .15s;
  }
  #drop:hover, #drop.over { border-color: var(--accent); background: var(--card-bg); }
  #drop .l1 { font-size: 17px; font-weight: 600; color: var(--primary); }
  #drop .l2 { font-size: 12.5px; color: var(--dark); margin-top: 8px; }
  #drop .fname { font-size: 14px; font-weight: 600; color: var(--primary); }
  input[type="file"] { display: none; }

  /* 模版选项 (无边框, 文字式) */
  .tpl-row {
    display: flex; gap: 56px; margin-top: 26px; padding: 0 8px;
    flex-wrap: wrap;
  }
  .tpl-opt { padding: 0 0 14px; cursor: pointer; font: inherit; text-align: left; }
  .tpl-opt:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
  .tpl-opt .ttl {
    font-size: 15px; font-weight: 600; color: var(--dark);
    padding-bottom: 10px; border-bottom: 2px solid transparent;
    display: inline-block; transition: all .15s;
  }
  .tpl-opt.sel .ttl { color: var(--primary); border-bottom-color: var(--accent); }
  .tpl-opt .sub { font-size: 12px; color: var(--dark); margin-top: 10px; }
  .tpl-opt .sub .tname { color: var(--primary); font-weight: 600; }
  button.act {
    margin-top: 10px; padding: 9px 22px; font-size: 13.5px;
    background: var(--primary); color: #fff; border: none; border-radius: 7px;
    cursor: pointer; font-weight: 600;
  }
  button.act:hover { background: #0060a5; }
  button.act.ghost { background: #fff; color: var(--primary);
                     border: 1px solid var(--primary); }
  button.act.ghost:hover { background: var(--card-bg); }

  /* 进度 */
  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 10px;
    padding: 20px; margin-top: 20px;
  }
  .status-row { display: flex; align-items: center; gap: 8px; font-size: 14px; margin-bottom: 10px; }
  .status-row .spin {
    width: 14px; height: 14px; border: 2px solid var(--line);
    border-top-color: var(--accent); border-radius: 50%;
    animation: r 0.8s linear infinite; display: none;
  }
  .status-row.running .spin { display: block; }
  @keyframes r { to { transform: rotate(360deg); } }
  .bar { height: 6px; background: var(--line); border-radius: 3px; overflow: hidden; margin: 8px 0 12px; }
  .bar i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .5s; }
  #log {
    background: #0f1b26; color: #c9e3f5; font: 12px/1.7 "SF Mono", Menlo, Consolas, monospace;
    border-radius: 8px; padding: 12px; height: 220px; overflow-y: auto;
    white-space: pre-wrap; word-break: break-all;
  }
  #log .ok { color: #7ee2a8; } #log .bad { color: #ffb4a8; }
  .dl {
    margin-top: 14px; display: none; align-items: center; gap: 12px;
    background: var(--card-bg); border: 1px solid var(--line);
    border-radius: 8px; padding: 14px;
  }
  .dl a {
    color: #fff; background: var(--primary); text-decoration: none;
    padding: 8px 18px; border-radius: 6px; font-size: 14px; font-weight: 600;
  }
  .dl .note { font-size: 12px; color: var(--dark); }
</style>
</head>
<body>
<header><div class="inner">
  <h1>Brand PPT Generator</h1>
</div></header>

<main>
  <div id="sidebar">
    <div class="cap">历史任务</div>
    <ul class="jobs" id="jobs"><li class="empty" style="cursor:default">暂无</li></ul>
  </div>

  <div id="maincol">
    <div id="drop" role="button" tabindex="0">
      <div class="l1 fname" id="fname">点击上传文件，自动生成PPT</div>
      <div class="l2" id="fhint">支持 pdf、word</div>
    </div>
    <input type="file" id="file" accept=".md,.markdown,.txt,.pdf,.docx" />
    <input type="file" id="tplfile" accept=".pptx" />

    <div class="tpl-row" role="radiogroup" aria-label="模版来源">
      <div class="tpl-opt" id="tpl-upload" role="radio" tabindex="0" aria-checked="false">
        <span class="ttl">上传模版</span>
        <div class="sub" id="tpl-note">使用自己的 PPT 模版主题色</div>
        <button type="button" class="act ghost" id="addtpl">添加模版</button>
        <button type="button" class="act" id="go2" style="display:none">生成 PPT</button>
      </div>
      <div class="tpl-opt sel" id="tpl-default" role="radio" tabindex="0" aria-checked="true">
        <span class="ttl">默认模版</span>
        <div class="sub">内置品牌蓝主题</div>
        <button type="button" class="act" id="go">生成 PPT</button>
      </div>
    </div>

    <div class="card" id="progcard" style="display:none">
      <div class="status-row" id="strow">
        <span class="spin"></span>
        <b id="sttext">排队中…</b>
        <span id="stpages" style="margin-left:auto;color:var(--dark);font-size:12px"></span>
      </div>
      <div class="bar"><i id="barfill"></i></div>
      <div id="log"></div>
      <div class="dl" id="dlrow">
        <a id="dllink" href="#">下载 PPTX</a>
        <span class="note" id="dlnote"></span>
      </div>
    </div>
  </div>
</main>

<script src="/app.js?v=3"></script>
</body>
</html>
